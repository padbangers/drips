[tab MANUAL]
art file=skin/drips_bg.jpg
enum_v cx=150 cy=430 label="" key=manual_page sw=220 options="BASICS,GRAINS,SEED,DELAY,QUALITIES,WAVETABLES,MIDI,MODULATION"
text cx=320 cy=214 label="BASICS" size=1.8 weight=700 color=c83d58 align=left when=manual_page:0
text cx=320 cy=254 label="Drips records the track's audio into a buffer and replays it as grains: up to 30 at once, each with its own" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:0
text cx=320 cy=289 label="position, length, envelope and pitch, followed by a reverb. Built on Emilie Gillet's open-source DSP." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:0
text cx=320 cy=359 label="TIME: where the grains start: left = the newest audio, right = the oldest (up to 32 s back)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:0
text cx=320 cy=394 label="SIZE: grain length. Shortest (8 ms) at 10 o'clock, 4 s at both ends; left of 10 the grains play reversed." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:0
text cx=320 cy=429 label="SIZE fully right turns Drips into a delay (see DELAY)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:0
text cx=320 cy=464 label="SHAPE: grain envelope: left hard and clicky, middle a smooth bell, right a slow swell like reversed grains." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:0
text cx=320 cy=499 label="PITCH: -24 ... +24 semitones, with notches at 0, 1, 3, 4, 7, 12 and 24. DENSITY: see GRAINS." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:0
text cx=320 cy=534 label="FREEZE (snowflake): stops recording; the grains keep playing what is in the buffer." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:0
text cx=320 cy=569 label="Grain settings are read when a grain starts: a change affects the next grains, not the ones playing." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:0
text cx=320 cy=214 label="GRAINS" size=1.8 weight=700 color=c83d58 align=left when=manual_page:1
text cx=320 cy=254 label="DENSITY at 12 o'clock: no grains (only the SEED button / input makes them)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:1
text cx=320 cy=289 label="Left of 12: grains at a steady rate, faster further left (up to the period of a C3 note)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:1
text cx=320 cy=324 label="Right of 12: grains at random times, more of them further right." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:1
text cx=320 cy=394 label="RANDOM knobs (attenurandomizers): random variation of each grain's TIME, SIZE, SHAPE or PITCH," size=1.45 weight=600 color=1d1d22 align=left when=manual_page:1
text cx=320 cy=429 label="picked when the grain starts. Right of 12 o'clock: evenly spread random values. Left: a peaky" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:1
text cx=320 cy=464 label="source, mostly small changes with occasional big ones. In delay mode they are slow random LFOs." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:1
text cx=320 cy=499 label="The more randomness (RANDOM knobs, random density), the wider the grains spread in stereo." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:1
text cx=320 cy=569 label="Modulation from the matrix is added to the knob, like a CV with the RANDOM knob fully right." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:1
text cx=320 cy=214 label="SEED" size=1.8 weight=700 color=c83d58 align=left when=manual_page:2
text cx=320 cy=254 label="SEED MODE and SEED INPUT are on the SETTINGS tab; the big SEED pad is on the DRIPS tab." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:2
text cx=320 cy=289 label="LATCHED (default): grains run continuously at the DENSITY rate." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:2
text cx=320 cy=324 label="GATED: grains only while SEED is down (a tap = 30 ms) or the Seed input is high, e.g." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:2
text cx=320 cy=359 label="while a MIDI note is held. At 12 o'clock each tap or note plays exactly one grain." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:2
text cx=320 cy=429 label="SEED INPUT, the module's SEED jack: MIDI (notes from a MIDI track, see MIDI) or the MPC tempo" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:2
text cx=320 cy=464 label="(Clock 1 Bar ... 1/32). With a clock and LATCHED, DENSITY changes meaning:" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:2
text cx=320 cy=499 label="right of 12 o'clock = probability that a clock pulse plays a grain (0 ... 100 %)," size=1.45 weight=600 color=1d1d22 align=left when=manual_page:2
text cx=320 cy=534 label="left of 12 o'clock = clock divider (fully left every pulse ... near 12 every 16th pulse)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:2
text cx=320 cy=569 label="The matrix destination SEED works as a Seed input too." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:2
text cx=320 cy=214 label="DELAY" size=1.8 weight=700 color=c83d58 align=left when=manual_page:3
text cx=320 cy=254 label="Turn SIZE fully right: one endless grain reads the buffer continuously, Drips becomes a delay" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:3
text cx=320 cy=289 label="(it fades over in about 1.5 s)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:3
text cx=320 cy=359 label="No Seed input, LATCHED: DENSITY sets the delay time. 12 o'clock = the whole buffer; turning" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:3
text cx=320 cy=394 label="either way shortens it, down to audio rate (flanging, combs). Right of 12 adds an uneven extra tap." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:3
text cx=320 cy=429 label="Seed input (Clock = tempo-synced delay) or SEED taps in GATED: the time between pulses is the" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:3
text cx=320 cy=464 label="base time; DENSITY picks a subdivision (left: binary only, right: more ratios)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:3
text cx=320 cy=499 label="FREEZE off: TIME multiplies the delay time. FREEZE on: TIME picks a slice that loops (beat slicer)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:3
text cx=320 cy=534 label="SHAPE: a synced envelope on each repeat (fully left = plain delay). PITCH: rotary-head pitch shifter" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:3
text cx=320 cy=569 label="(off at 12 o'clock). The RANDOM knobs add slow random modulation." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:3
text cx=320 cy=214 label="QUALITIES" size=1.8 weight=700 color=c83d58 align=left when=manual_page:4
text cx=320 cy=254 label="The recording quality sets the sound and the buffer length (stereo / mono):" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:4
text cx=320 cy=324 label="BRIGHT DIGITAL  48 kHz 16-bit: clean.  4 s / 8 s" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:4
text cx=320 cy=359 label="COLD DIGITAL  32 kHz 12-bit: the classic, slightly lo-fi grain sound.  8 s / 16 s" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:4
text cx=320 cy=394 label="SUNNY TAPE  24 kHz 12-bit, dry signal at 48 kHz, tape saturation with IN GAIN.  10 s / 20 s" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:4
text cx=320 cy=429 label="SCORCHED CASSETTE  24 kHz 8-bit u-law, saturation and wow & flutter.  16 s / 32 s" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:4
text cx=320 cy=499 label="BUFFER MONO doubles the time (the input is summed to mono; the grains still pan in stereo)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:4
text cx=320 cy=534 label="Changing quality, buffer or source clears the buffer. While frozen, the change waits until FREEZE is off." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:4
text cx=320 cy=569 label="Each quality limits the feedback in its own way; Drips resamples to the module's own rate, as on hardware." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:4
text cx=320 cy=214 label="WAVETABLES" size=1.8 weight=700 color=c83d58 align=left when=manual_page:5
text cx=320 cy=254 label="SOURCE WAVETABLES: no input needed. Drips makes grains from built-in wavetables," size=1.45 weight=600 color=1d1d22 align=left when=manual_page:5
text cx=320 cy=289 label="like the module does when nothing is patched into it." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:5
text cx=320 cy=359 label="FEEDBACK selects the wavetable bank. TIME: the position in the bank (which waveform)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:5
text cx=320 cy=394 label="DRY/WET: the plain oscillator against the grains. SIZE, SHAPE and DENSITY work as with audio." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:5
text cx=320 cy=429 label="PITCH (and MIDI notes with MIDI PITCH on) sets the root note; RANDOM randomises the grains' pitch." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:5
text cx=320 cy=464 label="FREEZE halts the grain envelopes and stops new grains." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:5
text cx=320 cy=499 label="QUALITY selects the output resolution: Bright Digital 16-bit, Cold Digital 7-bit," size=1.45 weight=600 color=1d1d22 align=left when=manual_page:5
text cx=320 cy=534 label="Sunny Tape 16-bit dry / 4-bit wet, Scorched Cassette 4-bit." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:5
text cx=320 cy=214 label="MIDI" size=1.8 weight=700 color=c83d58 align=left when=manual_page:6
text cx=320 cy=254 label="MPC OS sends no MIDI to insert effects, so every Drips opens its own MIDI input:" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:6
text cx=320 cy=289 label="Drips 1, Drips 2, ... (the number counts the instances in the order they were inserted)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:6
text cx=320 cy=359 label="To play it: make a MIDI track and set its MIDI output to Drips 1. Notes are the module's two jacks:" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:6
text cx=320 cy=394 label="PITCH (V/OCT) with MIDI PITCH on, transposing relative to C3, and SEED with SEED INPUT = MIDI." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:6
text cx=320 cy=429 label="MIDI SPLIT on (SETTINGS): channel 1 only transposes, channel 2 only seeds, like a sequencer's CV and" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:6
text cx=320 cy=464 label="gate patched into the module: one track plays the melody, another the rhythm." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:6
text cx=320 cy=499 label="Envelopes set to MIDI and the velocity source follow the seeding notes." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:6
text cx=320 cy=569 label="Classic: SEED INPUT MIDI, DENSITY at 12 o'clock, FREEZE on: every note plays a grain at its pitch." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:6
text cx=320 cy=214 label="MODULATION" size=1.8 weight=700 color=c83d58 align=left when=manual_page:7
text cx=320 cy=254 label="Two envelopes, two LFOs and an 8-slot matrix, like patch cables into the module's CV inputs." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:7
text cx=320 cy=324 label="ENV 1 / ENV 2: attack, decay, sustain, release. TRIGGER: MIDI notes, or LFO 1 / LFO 2 (each cycle)." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:7
text cx=320 cy=359 label="LFO 1 / LFO 2: seven shapes. SYNC off: the knob sets the rate in Hz. SYNC on: it locks to the MPC" size=1.45 weight=600 color=1d1d22 align=left when=manual_page:7
text cx=320 cy=394 label="tempo and picks a note value from 4 bars to 1/32." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:7
text cx=320 cy=464 label="MATRIX: source -> destination -> amount (-100 to +100 %). Sources: LFOs, envelopes, note velocity." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:7
text cx=320 cy=499 label="Several slots on one destination add up. FREEZE and SEED are gates: on above 50 %." size=1.45 weight=600 color=1d1d22 align=left when=manual_page:7
